<!doctype html>
<!--
  PROTVIS: a protein, as ESM-2 sees it. Purely to look at. Matte, pastel.

  SHIFT-2  landscape (B town)
  SHIFT-3  explode into layers     SHIFT-1  fold
  K        palette                 C        contacts
  SPACE    spin                    /        paste a sequence
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ProtVis</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />
<style>
  /* one look on purpose: matte clay on warm paper, soft daylight, quiet grey type */
  :root {
    --field: #f1ede7;
    --field-edge: #e6e0d8;
    --caption: #9a948b;
    --caption-hi: #4a4741;
    --line: #d9d2c8;
    --accent: #e99a94;
    --dot: #9cc3e4;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: radial-gradient(ellipse at 50% 42%, var(--field) 45%, var(--field-edge) 100%) fixed, var(--field); color: var(--caption); font: 300 10.5px/1.8 var(--mono); letter-spacing: .14em; text-transform: uppercase; -webkit-font-smoothing: antialiased; }
  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  canvas#gl:active { cursor: grabbing; }

  .ui { position: fixed; z-index: 10; transition: opacity 1.2s; }
  body.idle .ui.fades { opacity: .0; }
  #cap { left: max(28px, env(safe-area-inset-left, 0px)); bottom: max(24px, env(safe-area-inset-bottom, 0px)); }
  #cap .name { color: var(--caption-hi); font-size: 13px; letter-spacing: .32em; font-weight: 400; }
  #scale { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  #scale i { display: block; height: 6px; width: 56px; border-radius: 3px; background: var(--caption-hi); }

  #side { right: max(28px, env(safe-area-inset-right, 0px)); top: max(24px, env(safe-area-inset-top, 0px)); text-align: right; }
  #demos { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  #demos a { color: var(--caption); cursor: pointer; text-decoration: none; transition: color .3s; }
  #demos a:hover, #demos a:focus-visible { color: var(--caption-hi); outline: none; }
  #demos a.on { color: var(--caption-hi); }
  #demos a.on::before { content: "● "; color: var(--dot); }
  #seq { margin-top: 10px; width: 220px; height: 22px; resize: none; overflow: hidden; display: block; margin-left: auto;
         background: transparent; border: 0; border-bottom: 1px solid var(--line); color: var(--caption-hi);
         font: inherit; letter-spacing: .06em; text-transform: uppercase; text-align: right; outline: none; transition: height .3s, width .3s, border-color .3s; }
  #seq:focus { height: 96px; width: min(360px, calc(100vw - 56px)); overflow: auto; text-align: left; word-break: break-all; border-color: var(--caption); }
  #seq::placeholder { color: var(--caption); opacity: .6; }
  #status { margin-top: 6px; max-width: 300px; margin-left: auto; text-transform: none; letter-spacing: .04em; min-height: 1.8em; }
  #status.err { color: #b8625b; }

  #hint { right: max(28px, env(safe-area-inset-right, 0px)); bottom: max(24px, env(safe-area-inset-bottom, 0px)); text-align: right; opacity: .7; }
  #hint b { color: var(--caption-hi); font-weight: 400; }

  #brand { left: max(28px, env(safe-area-inset-left, 0px)); top: max(24px, env(safe-area-inset-top, 0px)); color: var(--caption-hi); letter-spacing: .4em; }
  #brand span { color: var(--caption); letter-spacing: .14em; display: block; }

  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  #labels div { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 9.5px; color: var(--caption); will-change: transform; transition: opacity .3s; }
  #labels div.res { color: var(--caption-hi); font-size: 11px; letter-spacing: .2em; }

  #toast { position: fixed; left: 50%; top: max(24px, env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 12; color: var(--caption-hi);
           opacity: 0; transition: opacity .6s; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: .85; transition: opacity .1s; }
  @media (max-width: 640px) {
    #hint { display: none; }
    #brand span { display: none; }
    #demos { flex-direction: row; flex-wrap: wrap; justify-content: flex-end; gap: 4px 12px; max-width: 60vw; }
  }
  @media (prefers-reduced-motion: reduce) { .ui { transition: none; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>

<div id="brand" class="ui fades">PROTVIS<span id="model">ESM-2</span></div>

<div id="side" class="ui fades">
  <nav id="demos" aria-label="Proteins"></nav>
  <textarea id="seq" spellcheck="false" placeholder="PASTE A SEQUENCE ↵" aria-label="Protein sequence"></textarea>
  <div id="status"></div>
</div>

<div id="cap" class="ui">
  <div class="name" id="name">—</div>
  <div id="meta"></div>
  <div id="scale"><i></i><span id="scaletxt">1 σ</span></div>
</div>

<div id="hint" class="ui fades"><b>SHIFT-2</b> LANDSCAPE &nbsp; <b>SHIFT-3</b> LAYERS &nbsp; <b>B</b> TOWN &nbsp; <b>K</b> PALETTE &nbsp; <b>C</b> CONTACTS &nbsp; <b>SPACE</b> SPIN</div>
<div id="toast" role="status"></div>

<!--DEMO-DATA-->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module" src="app.js"></script>
</body>
</html>
